<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tracker Dashboard</title>
    <!-- Import Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --notion-bg: #ffffff;
            --notion-text: #37352f;
            --notion-border: #e9e9e7;
            --primary-color: #2eaadc;
            --danger-color: #e03e3e;
            --success-color: #0f7b6c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            background-color: var(--notion-bg);
            color: var(--notion-text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--notion-border);
            padding-bottom: 10px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .control-panel {
            background: #f7f7f5;
            padding: 16px;
            border-radius: 6px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-add { background-color: var(--success-color); color: white; }
        .btn-add:hover { background-color: #0d6b5e; }
        
        .btn-subtract { background-color: var(--danger-color); color: white; }
        .btn-subtract:hover { background-color: #c93535; }

        .btn-update { background-color: var(--primary-color); color: white; margin-top: 10px; }
        .btn-update:hover { background-color: #258cb5; }

        .summary-card {
            background: white;
            border: 1px solid var(--notion-border);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
        }

        .total-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--success-color);
            margin: 10px 0 0 0;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .pot-breakdown {
            margin-top: 15px;
            font-size: 14px;
        }
        
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Savings & Expense Tracker</h2>
    
    <div class="summary-card">
        <div>Total Bank Account Pot</div>
        <div class="total-amount" id="totalDisplay">€0.00</div>
    </div>

    <div class="dashboard-grid">
        <div class="control-panel">
            <h3>Manage Funds</h3>
            
            <div class="input-group">
                <label>Set Monthly Automated Addition (28th)</label>
                <input type="number" id="autoAddInput" placeholder="e.g. 1000" />
                <button class="btn-update" onclick="setAutomatedAmount()">Set Amount</button>
            </div>
            
            <hr style="border-top: 1px solid #ddd; margin: 20px 0;">

            <div class="input-group">
                <label>Manual Adjustment (Expenses/Income)</label>
                <input type="number" id="manualInput" placeholder="Amount..." />
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-add" onclick="updatePot(true)">+ Add Income</button>
                <button class="btn-subtract" onclick="updatePot(false)">- Minus Expense</button>
            </div>
        </div>

        <div>
            <div class="chart-container">
                <canvas id="potChart"></canvas>
            </div>
            
            <div class="pot-breakdown">
                <h4>Current Distribution (Estimated Target Rules)</h4>
                <div class="breakdown-item">
                    <span>Essentials (50%)</span>
                    <span id="essentialsVal">€0.00</span>
                </div>
                <div class="breakdown-item">
                    <span>Wants (30%)</span>
                    <span id="wantsVal">€0.00</span>
                </div>
                <div class="breakdown-item">
                    <span>Savings Tracker (20%)</span>
                    <span id="savingsVal">€0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initial State Variables
    let totalPot = 0;
    let autoAddAmount = 0;
    let chartInstance = null;
    
    // Distribution Rules (Customizable)
    const RULES = {
        essentials: 0.50,
        wants: 0.30,
        savings: 0.20
    };

    // Load saved data from localStorage on start
    function init() {
        const savedData = localStorage.getItem('notionSavingsData');
        if (savedData) {
            const parsed = JSON.parse(savedData);
            totalPot = parsed.totalPot || 0;
            autoAddAmount = parsed.autoAddAmount || 0;
            document.getElementById('autoAddInput').value = autoAddAmount;
        }
        
        checkAutomatedDate();
        updateUI();
    }

    // Save data to localStorage
    function saveData() {
        const data = {
            totalPot: totalPot,
            autoAddAmount: autoAddAmount,
            lastCheckedDate: new Date().toISOString()
        };
        localStorage.setItem('notionSavingsData', JSON.stringify(data));
    }

    // Set the monthly addition amount
    function setAutomatedAmount() {
        const input = document.getElementById('autoAddInput').value;
        if(input && !isNaN(input)) {
            autoAddAmount = parseFloat(input);
            saveData();
            alert(`Automated monthly addition set to €${autoAddAmount.toFixed(2)} for the 28th of each month.`);
        }
    }

    // Manual add or subtract
    function updatePot(isAddition) {
        const input = document.getElementById('manualInput').value;
        if(!input || isNaN(input)) return;
        
        const amount = parseFloat(input);
        
        if(isAddition) {
            totalPot += amount;
        } else {
            totalPot -= amount;
        }
        
        // Prevent negative balances if desired
        if(totalPot < 0) totalPot = 0;
        
        document.getElementById('manualInput').value = ''; // clear input
        saveData();
        updateUI();
    }

    // Check if today is the 28th and if we need to add the automated amount
    function checkAutomatedDate() {
        const today = new Date();
        const savedData = localStorage.getItem('notionSavingsData');
        
        if (savedData && today.getDate() === 28) {
            const parsed = JSON.parse(savedData);
            const lastChecked = new Date(parsed.lastCheckedDate);
            
            // If we haven't already added it this month
            if (lastChecked.getMonth() !== today.getMonth() || lastChecked.getFullYear() !== today.getFullYear()) {
                if(autoAddAmount > 0) {
                    totalPot += autoAddAmount;
                    saveData();
                    alert(`Automated Addition: €${autoAddAmount.toFixed(2)} has been added to your pot for the 28th!`);
                }
            }
        }
    }

    // Update the UI text and the Pie Chart
    function updateUI() {
        // Update Total Display
        document.getElementById('totalDisplay').innerText = `€${totalPot.toFixed(2)}`;
        
        // Calculate splits
        const essentialsVal = totalPot * RULES.essentials;
        const wantsVal = totalPot * RULES.wants;
        const savingsVal = totalPot * RULES.savings;
        
        // Update Breakdown text
        document.getElementById('essentialsVal').innerText = `€${essentialsVal.toFixed(2)}`;
        document.getElementById('wantsVal').innerText = `€${wantsVal.toFixed(2)}`;
        document.getElementById('savingsVal').innerText = `€${savingsVal.toFixed(2)}`;

        // Render Chart
        renderChart(essentialsVal, wantsVal, savingsVal);
    }

    // Draw or update Chart.js pie chart
    function renderChart(essentials, wants, savings) {
        const ctx = document.getElementById('potChart').getContext('2d');
        
        // If all 0, show a grey placeholder
        const dataValues = totalPot === 0 ? [1] : [essentials, wants, savings];
        const bgColors = totalPot === 0 
            ? ['#e9e9e7'] 
            : ['#e03e3e', '#f5b041', '#0f7b6c'];
            
        const labels = totalPot === 0 
            ? ['Empty Pot'] 
            : ['Essentials (50%)', 'Wants (30%)', 'Savings (20%)'];

        if(chartInstance) {
            chartInstance.destroy(); // destroy old chart to redraw
        }

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    backgroundColor: bgColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });
    }

    // Run on load
    window.onload = init;
</script>

</body>
</html>
